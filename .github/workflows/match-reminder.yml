name: Match Reminder

on:
  schedule:
    # 8:30 JST
    - cron: '30 23 * * *'
    # 12:30 JST
    - cron: '30 3 * * *'
    # 20:30 JST
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Post match reminder
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
        run: |
          for i in 1 2 3; do
            python match_reminder.py && exit 0
            echo "失敗（試行 $i/3）。30秒後にリトライします。"
            sleep 30
          done
          exit 1
